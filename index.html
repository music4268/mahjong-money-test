<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>麻將即時記帳</title><style>
*{box-sizing:border-box}body{margin:0;background:#F7F1E5;color:#163B32;font-family:system-ui,-apple-system,sans-serif}main{max-width:560px;margin:auto;padding:12px}header{background:#163B32;color:white;padding:17px;border-radius:16px}h1{font-size:24px;margin:0 0 5px}section{background:white;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 6px #0001}input,button{font:inherit;padding:11px;border:1px solid #cbd9d0;border-radius:10px}input{width:100%}button{cursor:pointer;background:#F7F1E5}button:disabled{opacity:.45}.primary{background:#163B32;color:white}.danger{color:#b52b2b;border-color:#e9b6b6}.wide{width:100%}.hidden{display:none!important}.muted{color:#64776c;font-size:13px}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.entry{padding:11px 0;border-bottom:1px solid #e5ebe7}.tabs{display:flex;gap:6px;margin-top:12px}.tabs button{flex:1}.pos{color:#15824b}.neg{color:#b63c3c}label{display:block;margin:9px 0 5px}#message{white-space:pre-wrap;color:#a0472c;min-height:1em}.winner-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.winner-grid button{padding:10px 6px}.selected{background:#E9A23B!important;color:#163B32!important}.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.keypad button{height:45px;font-size:21px;font-weight:600;padding:4px}.summary{background:#f0f5f1;border-radius:10px;padding:11px}.mini{font-size:13px;padding:7px 9px}.pending{border:2px solid #f2bd50;background:#fffaf0}.pending-card{background:white;border:1px solid #eadab4;border-radius:10px;padding:10px;margin:8px 0}.pending-card .row button{flex:1}.overlay{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}.dialog{width:100%;max-width:390px;background:white;border-radius:18px;padding:20px;max-height:85vh;overflow:auto}.dialog h2{margin-top:0}.dialog .row{margin-top:12px}.dialog .row button{flex:1}.score-table{width:100%;border-collapse:collapse;font-size:13px}.score-table th,.score-table td{padding:9px 3px;border-bottom:1px solid #e5ebe7;text-align:center}.score-table th:first-child,.score-table td:first-child{text-align:left}.settlement-row{padding:12px;background:#f1f5f2;border-radius:10px;margin:8px 0}.lock{border-top:1px dashed #cbd9d0;padding-top:18px;margin-top:22px}.toast{color:#176244}.tag{font-size:12px;background:#fff1c9;padding:3px 7px;border-radius:8px}
#welcome{z-index:120;background:#163b32dd}#welcome .dialog{background:#F7F1E5;text-align:center;border:3px solid #E9A23B}#welcomeQuote{font-size:22px;line-height:1.6;font-weight:700}.winner-grid button{overflow-wrap:anywhere;min-height:50px}.achievement-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.achievement-card{background:#F7F1E5;padding:12px;border-radius:12px;text-align:center}.achievement-card strong{display:block;margin-top:6px}</style></head><body><main><header><h1>🀄 麻將即時記帳</h1><div>同房間累計・即時同步・今日結算</div><small id="connection">正在連線…</small></header>
<section id="setup"><h2 id="setupTitle">進入牌桌</h2><label>你的名字</label><input id="name" maxlength="20" placeholder="例如：阿明" autocomplete="nickname"><div id="joinArea"><label>房號</label><input id="roomCode" maxlength="8" placeholder="朋友分享的房號"><button class="primary wide" id="join" style="margin-top:10px">加入牌桌</button></div><div id="createArea"><h3>建立新牌桌</h3><div class="row"><div style="flex:1"><label>底金（元）</label><input id="newBase" type="number" min="0" step="1" value="30"></div><div style="flex:1"><label>每台（元）</label><input id="newRate" type="number" min="0" step="1" value="10"></div></div><button class="wide" id="create">建立新牌桌</button></div><p class="muted" id="setupHelp">每間房最多 8 人。相同房號與名字可恢復原本玩家。</p></section>
<div id="app" class="hidden"><section><div class="row between"><h2 id="roomTitle" style="margin:0"></h2><span id="ownerTag" class="tag hidden">房主</span></div><p id="people" class="muted"></p><p id="rulesText" class="muted"></p><button id="invite" class="mini">分享房間連結</button></section>

<div id="activeRoom"><div class="tabs"><button data-tab="pay" class="selected">放槍</button><button data-tab="score">總帳</button></div><section id="pay"><h2 style="margin:0 0 8px">我放槍了</h2><label>贏家是誰？</label><div id="winnerGrid" class="winner-grid"></div><div class="row between" style="margin:10px 0 4px"><strong>放槍台數</strong><strong id="taiDisplay">0 台</strong></div><div id="keypad" class="keypad"></div><div class="summary row between" style="margin:9px 0"><span>應付金額</span><strong id="amount">0 元</strong></div><button class="primary wide" id="send">送出，等待贏家接收</button></section><section id="score" class="hidden"><div class="row between"><h2 style="margin:0">累積輸贏</h2><button id="showHistory" class="mini">已確認紀錄</button></div><div id="scores"></div><h3>🏆 今日成就</h3><div id="achievements"></div><div id="ownerControls" class="lock hidden"><p class="muted">房主專屬操作，結算後永久停止記帳。</p><button id="endGame" class="danger wide">結束今日牌局・進行結算</button></div></section></div>
<section id="final" class="hidden"><h2>🏁 今日最終結算</h2><p class="muted">本房間已結算，無法再新增付款。</p><h3>最終輸贏</h3><div id="finalScores"></div><h3>建議付款清單</h3><div id="transfers"></div><h3>🏆 今日成就</h3><div id="finalAchievements"></div><h3>📜 今日完整紀錄</h3><div id="finalHistoryList"></div></section></div>
<section><p id="message"></p></section></main>
<div id="welcome" class="overlay hidden"><div class="dialog"><h2>🀄 入房開運籤</h2><p id="welcomeQuote"></p><p class="muted">財神友情提醒・僅供娛樂</p></div></div><div id="waiting" class="overlay hidden"><div class="dialog" style="text-align:center"><h2>🀄 等待贏家接收</h2><p id="waitingText"></p><p class="muted">對方接收或拒絕後，此視窗會自動消失。</p></div></div>
<div id="modal" class="overlay hidden"><div class="dialog"><div class="row between"><h2 id="modalTitle"></h2><button id="modalClose" class="mini" aria-label="關閉">✕</button></div><div id="modalBody"></div><div id="modalActions" class="row"></div></div></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';

import {getDatabase,ref,get,set,push,onValue,runTransaction} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js';
const config={apiKey:'AIzaSyAkYCerFM-Lan4bkC6bFikRwybWwz-3fmg',authDomain:'mahjong-money-test.firebaseapp.com',databaseURL:'https://mahjong-money-test-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'mahjong-money-test',storageBucket:'mahjong-money-test.firebasestorage.app',messagingSenderId:'179123883491',appId:'1:179123883491:web:404fdf532fdda409e464d6'};
const db=getDatabase(initializeApp(config)),auth=getAuth();
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('zh-TW');const say=s=>$('message').textContent=s;
let authUid='',roomId='',playerId='',room=null,off=null,tab='pay',winner='',digits='0',lastStatuses=new Map(),initialSync=true,joining=false;
const blessings=["今天手氣旺，摸牌自帶光！", "財神已就位，準備大發威！", "今天不求神，只求自摸門清！", "好運坐你旁，胡牌不用慌！", "東南西北風，今天你最紅！", "紅中發財到，胡牌沒煩惱！", "坐下先別急，財神正在找你！", "好牌接著來，歡樂打起來！", "祝你牌牌順，局局都有運！", "財神爺已上線，請其他三家小心！", "今天不是來打牌，是來領年終的！", "牌可以亂摸，氣勢不能輸！", "技術不一定有，氣勢一定要夠！", "財神說你今天有戲，至於哪齣戲他沒說！", "今天的目標：讓其他三家懷疑人生！", "手氣不好沒關係，嘴巴一定要贏！", "胡牌靠實力，自摸靠祖先保庇！", "青龍白虎來護駕，拜託不要一直放槍！", "今天不求大三元，只求不要當提款機！", "牌桌沒有永遠的輸家，只有還沒轉運的你！", "今天如果沒胡牌，至少要胡說八道！", "贏了叫牌技，輸了叫做公益！", "牌運正在載入中……請勿催促財神！"];function showWelcome(){$('welcomeQuote').textContent=blessings[Math.floor(Math.random()*blessings.length)];$('welcome').classList.remove('hidden');setTimeout(()=>$('welcome').classList.add('hidden'),3000);}
const invited=new URLSearchParams(location.search).get('room');
if(invited){$('roomCode').value=invited.trim().toUpperCase();$('createArea').classList.add('hidden');$('setupTitle').textContent='加入朋友的牌桌';$('setupHelp').textContent='已自動帶入房號，輸入名字即可加入。';}
function validMoney(n){return Number.isSafeInteger(n)&&n>=0&&n<=1000000;}
function normalName(s){return String(s||'').trim();}
function ensureAuth(){if(!authUid){say('正在連線，請稍候再試');return false;}return true;}
function modal(title,body,actions=[]){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalActions').replaceChildren();actions.forEach(a=>{const b=document.createElement('button');b.textContent=a.label;b.className=a.className||'';b.onclick=a.action;$('modalActions').appendChild(b);});$('modal').classList.remove('hidden');}
function closeModal(){$('modal').classList.add('hidden');}
$('modalClose').onclick=closeModal;
function openRoom(id,pid){roomId=id;playerId=pid;initialSync=true;lastStatuses=new Map();if(off)off();off=onValue(ref(db,'rooms/'+id),snap=>{room=snap.val();if(!room){say('房間不存在');return;}render();},e=>say('同步失敗：'+e.message));history.replaceState(null,'',location.pathname+'?room='+encodeURIComponent(id));$('setup').classList.add('hidden');$('app').classList.remove('hidden');}
signInAnonymously(auth).then(r=>{authUid=r.user.uid;$('connection').textContent='已連線';}).catch(e=>{$('connection').textContent='連線失敗';say('登入失敗：'+e.message);});
$('create').onclick=async()=>{if(!ensureAuth()||joining)return;const name=normalName($('name').value),base=Number($('newBase').value),rate=Number($('newRate').value);if(!name)return say('請輸入名字');if(!validMoney(base)||!validMoney(rate))return say('請輸入正確的底金與每台金額');joining=true;$('create').disabled=true;try{let id;for(let i=0;i<5;i++){const x=Math.random().toString(36).slice(2,8).toUpperCase();const result=await runTransaction(ref(db,'rooms/'+x),v=>v===null?{owner:authUid,ownerPlayer:authUid,base,rate,createdAt:Date.now(),status:'active',players:{[authUid]:{name}}}:undefined,{applyLocally:false});if(result.committed){id=x;break;}}if(!id)throw Error('無法建立房號，請重試');openRoom(id,authUid);showWelcome();}catch(e){say('建立失敗：'+e.message);}finally{joining=false;$('create').disabled=false;}};
$('join').onclick=async()=>{if(!ensureAuth()||joining)return;const name=normalName($('name').value),id=$('roomCode').value.trim().toUpperCase();if(!name||!id)return say('請輸入名字和房號');joining=true;$('join').disabled=true;try{const roomRef=ref(db,'rooms/'+id);const initial=await get(roomRef);if(!initial.exists())throw Error('找不到房間');const data=initial.val();const existing=Object.entries(data.players||{}).find(([,p])=>normalName(p.name)===name);if(existing){openRoom(id,existing[0]);showWelcome();return;}if(data.status==='closed')throw Error('房間已結算，只有原玩家可以查看');if(Object.keys(data.players||{}).length>=8)throw Error('房間已滿（8 人）');let chosen='';const result=await runTransaction(roomRef,v=>{if(!v||v.status==='closed')return;const players=v.players||{};const match=Object.entries(players).find(([,p])=>normalName(p.name)===name);if(match){chosen=match[0];return v;}if(Object.keys(players).length>=8)return;const newId=players[authUid]?push(ref(db,'rooms/'+id+'/players')).key:authUid;chosen=newId;return {...v,players:{...players,[newId]:{name}}};},{applyLocally:false});if(!result.committed){const latest=await get(roomRef);if(!latest.exists())throw Error('找不到房間');const latestData=latest.val();const match=Object.entries(latestData.players||{}).find(([,p])=>normalName(p.name)===name);if(match){chosen=match[0];}else if(latestData.status==='closed')throw Error('房間已結算');else if(Object.keys(latestData.players||{}).length>=8)throw Error('房間已滿（8 人）');else throw Error('資料庫交易未完成，請重試');}if(!chosen){const match=Object.entries(result.snapshot.val()?.players||{}).find(([,p])=>normalName(p.name)===name);chosen=match?.[0];}if(!chosen)throw Error('無法確認玩家身分');openRoom(id,chosen);showWelcome();}catch(e){say('加入失敗：'+(e.code?e.code+'／':'')+e.message);}finally{joining=false;$('join').disabled=false;}};
$('invite').onclick=async()=>{const link=location.origin+location.pathname+'?room='+encodeURIComponent(roomId);try{if(navigator.share)await navigator.share({title:'麻將牌桌',url:link});else{await navigator.clipboard.writeText(link);say('邀請連結已複製');}}catch(e){if(e.name!=='AbortError')prompt('請複製連結',link);}};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});
for(const k of ['1','2','3','4','5','6','7','8','9','清除','0','⌫']){const b=document.createElement('button');b.textContent=k;b.onclick=()=>{if(k==='清除')digits='0';else if(k==='⌫')digits=digits.length>1?digits.slice(0,-1):'0';else digits=digits==='0'?k:(digits+k).slice(0,3);updateAmount();};$('keypad').appendChild(b);}
function updateAmount(){const n=Number(digits);$('taiDisplay').textContent=n+' 台';$('amount').textContent=room?money(Number(room.base)+n*Number(room.rate))+' 元':'0 元';$('send').disabled=!winner||n===0||room?.status==='closed';}
function payments(){return Object.entries(room?.payments||{});}
function compute(){const players=room.players||{},sums=Object.fromEntries(Object.keys(players).map(k=>[k,0]));const stats=Object.fromEntries(Object.keys(players).map(k=>[k,{discard:0,win:0,self:0,hit:0}]));const grouped=new Set();for(const [id,p] of payments()){if(p.status!=='accepted')continue;sums[p.from]=(sums[p.from]||0)-Number(p.amount);sums[p.to]=(sums[p.to]||0)+Number(p.amount);if(p.kind==='selfdraw'&&p.groupId){if(grouped.has(p.groupId))continue;grouped.add(p.groupId);const batch=payments().filter(([,x])=>x.groupId===p.groupId&&x.kind==='selfdraw'&&x.status==='accepted');if(batch.length===3&&new Set(batch.map(([,x])=>x.from)).size===3){stats[p.to]&&(stats[p.to].self++);batch.forEach(([,x])=>{stats[x.from]&&(stats[x.from].hit++);});} }else{stats[p.from]&&(stats[p.from].discard++);stats[p.to]&&(stats[p.to].win++);}}return {sums,stats};}
function statsHtml(stats){return '<table class="score-table"><thead><tr><th>玩家</th><th>放槍</th><th>胡別人</th><th>自摸</th><th>被自摸</th></tr></thead><tbody>'+Object.entries(room.players||{}).map(([id,p])=>{const s=stats[id]||{discard:0,win:0,self:0,hit:0};return `<tr><td>${esc(p.name)}</td><td>${s.discard}</td><td>${s.win}</td><td>${s.self}</td><td>${s.hit}</td></tr>`;}).join('')+'</tbody></table>';}
function scoresHtml(sums){return Object.entries(room.players||{}).sort(([a],[b])=>sums[b]-sums[a]).map(([id,p])=>`<div class="entry row between"><b>${esc(p.name)}</b><strong class="${sums[id]>=0?'pos':'neg'}">${sums[id]>0?'+':''}${money(sums[id])} 元</strong></div>`).join('');}
function achievementsHtml(stats){const cats=[['🏆 胡牌王','win'],['🌟 自摸王','self'],['💥 放槍王','discard'],['😵 被自摸王','hit']];return '<div class="achievement-grid">'+cats.map(([title,key])=>{const sorted=Object.entries(room.players||{}).sort(([a],[b])=>(stats[b]?.[key]||0)-(stats[a]?.[key]||0));const max=sorted.length?(stats[sorted[0][0]]?.[key]||0):0;const names=max?sorted.filter(([id])=>(stats[id]?.[key]||0)===max).map(([,p])=>esc(p.name)).join('、'):'尚未產生';return `<div class="achievement-card"><b>${title}</b><strong>${names}</strong><span class="muted">${max} 次</span></div>`;}).join('')+'</div>';}function historyHtml(){return payments().filter(([,p])=>p.status==='accepted').reverse().map(([,p])=>`<div class="entry">${esc(room.players?.[p.from]?.name||'未知')} → ${esc(room.players?.[p.to]?.name||'未知')}｜${p.tai} 台｜${money(p.amount)} 元${p.kind==='selfdraw'?'（自摸）':''}</div>`).join('')||'<p class="muted">尚無已確認紀錄</p>';}
function showHistory(){modal('已確認紀錄',historyHtml());}$('showHistory').onclick=showHistory;
function transferPlan(sums){const debt=Object.entries(sums).filter(([,v])=>v<0).map(([id,v])=>({id,n:-v})),credit=Object.entries(sums).filter(([,v])=>v>0).map(([id,v])=>({id,n:v}));const total=debt.reduce((a,x)=>a+x.n,0);if(total!==credit.reduce((a,x)=>a+x.n,0))return [];let best=null;function dfs(ds,cs,edges){if(best&&edges.length>=best.length)return;let i=ds.findIndex(x=>x.n>0);if(i<0){best=edges.slice();return;}const seen=new Set();for(let j=0;j<cs.length;j++){if(cs[j].n<=0||seen.has(cs[j].n))continue;seen.add(cs[j].n);const amount=Math.min(ds[i].n,cs[j].n);ds[i].n-=amount;cs[j].n-=amount;edges.push({from:ds[i].id,to:cs[j].id,amount});dfs(ds,cs,edges);edges.pop();ds[i].n+=amount;cs[j].n+=amount;}}dfs(debt,credit,[]);return best||[];}
function finalHtml(sums,stats){$('finalHistoryList').innerHTML=historyHtml();$('finalScores').innerHTML=scoresHtml(sums);$('finalAchievements').innerHTML=statsHtml(stats);const transfers=room.settlement?.transfers||transferPlan(sums);$('transfers').innerHTML=transfers.length?transfers.slice().sort((a,b)=>Number(b.from===playerId||b.to===playerId)-Number(a.from===playerId||a.to===playerId)).map(t=>`<div class="settlement-row"><b>${esc(room.players?.[t.from]?.name||'未知')} → ${esc(room.players?.[t.to]?.name||'未知')}</b><strong style="float:right">${money(t.amount)} 元</strong></div>`).join(''):'<p>所有帳目已平衡，無須轉帳。</p>';}
function render(){if(!room)return;const closed=room.status==='closed';$('roomTitle').textContent='房號：'+roomId;$('people').textContent='玩家：'+Object.values(room.players||{}).map(p=>p.name).join('、');$('rulesText').textContent=`底金 ${money(room.base)} 元／每台 ${money(room.rate)} 元（固定）`;$('ownerTag').classList.toggle('hidden',room.ownerPlayer!==playerId);$('activeRoom').classList.toggle('hidden',closed);$('final').classList.toggle('hidden',!closed);$('incoming').classList.toggle('hidden',closed);$('ownerControls').classList.toggle('hidden',closed||room.ownerPlayer!==playerId);const {sums,stats}=compute();if(closed){finalHtml(sums,stats);$('waiting').classList.add('hidden');$('incoming').classList.add('hidden');return;}
const playerOptions=Object.entries(room.players||{}).filter(([id])=>id!==playerId);if(!playerOptions.some(([id])=>id===winner))winner='';$('winnerGrid').innerHTML=playerOptions.map(([id,p])=>`<button class="${id===winner?'selected':''}" data-winner="${esc(id)}">${esc(p.name)}${id===winner?' ✓':''}</button>`).join('');$('winnerGrid').querySelectorAll('button').forEach(b=>b.onclick=()=>{winner=b.dataset.winner;render();});updateAmount();const pending=payments().filter(([,p])=>p.to===playerId&&p.status==='pending');$('incoming').classList.toggle('hidden',pending.length===0);$('pendingCount').textContent='('+pending.length+' 筆)';$('pendingList').innerHTML=pending.map(([id,p])=>`<div class="pending-card"><div class="row between"><label style="margin:0"><input type="checkbox" class="self-select" data-id="${esc(id)}" style="width:auto">自摸</label><b>${esc(room.players?.[p.from]?.name||'未知')}</b><strong>${money(p.amount)} 元</strong></div><p class="muted">${p.tai} 台</p><div class="row"><button class="primary" data-action="accepted" data-id="${esc(id)}">接收</button><button class="danger" data-action="rejected" data-id="${esc(id)}">拒絕</button></div></div>`).join('');$('pendingList').querySelectorAll('button').forEach(b=>b.onclick=()=>handlePayment(b.dataset.id,b.dataset.action));$('acceptAll').classList.toggle('hidden',pending.length<3);$('scores').innerHTML=scoresHtml(sums);$('achievements').innerHTML=statsHtml(stats);$('pay').classList.toggle('hidden',tab!=='pay');$('score').classList.toggle('hidden',tab!=='score');document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('selected',b.dataset.tab===tab));const mine=payments().filter(([,p])=>p.from===playerId&&p.status==='pending');$('waiting').classList.toggle('hidden',mine.length===0);$('waitingText').textContent=mine.map(([,p])=>`${room.players?.[p.to]?.name||'贏家'}：${money(p.amount)} 元`).join('、');const nextStatuses=new Map(payments().filter(([,p])=>p.from===playerId).map(([id,p])=>[id,p.status]));if(!initialSync){for(const [id,status] of nextStatuses){if(lastStatuses.get(id)==='pending'&&status!=='pending')say(status==='accepted'?'✅ 贏家已接收，正式入帳！':'⚠️ 贏家拒絕了這筆付款。');}}initialSync=false;lastStatuses=nextStatuses;}
$('send').onclick=async()=>{if(!room||!winner||!Number(digits))return say('請先選贏家並輸入至少 1 台');const tai=Number(digits),amount=Number(room.base)+tai*Number(room.rate);if(!Number.isSafeInteger(amount))return say('金額無效');$('send').disabled=true;try{const result=await runTransaction(ref(db,'rooms/'+roomId),v=>{if(!v||v.status==='closed'||!v.players?.[playerId]||!v.players?.[winner]||winner===playerId)return;const id=push(ref(db,'rooms/'+roomId+'/payments')).key;return {...v,payments:{...(v.payments||{}),[id]:{from:playerId,to:winner,tai,amount,status:'pending',createdAt:Date.now()}}};},{applyLocally:false});if(!result.committed)throw Error('房間已結算或玩家不存在');digits='0';winner='';updateAmount();say('已送出，等待贏家接收。');}catch(e){say('送出失敗：'+e.message);}finally{$('send').disabled=false;}};
async function handlePayment(id,action){try{const result=await runTransaction(ref(db,'rooms/'+roomId),v=>{const p=v?.payments?.[id];if(!v||v.status==='closed'||!p||p.to!==playerId||p.status!=='pending')return;return {...v,payments:{...v.payments,[id]:{...p,status:action,acceptedAt:Date.now(),kind:'discard'}}};},{applyLocally:false});say(result.committed?'已處理這筆款項':'這筆款項已處理');}catch(e){say('操作失敗：'+e.message);}}
$('acceptAll').onclick=async()=>{const selectedIds=[...document.querySelectorAll('.self-select:checked')].map(x=>x.dataset.id);if(selectedIds.length!==3)return say('請勾選同一次自摸的三筆款項');try{const result=await runTransaction(ref(db,'rooms/'+roomId),v=>{if(!v||v.status==='closed')return;const entries=Object.entries(v.payments||{}).filter(([id,p])=>selectedIds.includes(id)&&p.to===playerId&&p.status==='pending');if(entries.length!==3||new Set(entries.map(([,p])=>p.from)).size!==3)return;const groupId=push(ref(db,'rooms/'+roomId+'/groups')).key;const next={...v.payments};entries.forEach(([id,p])=>{next[id]={...p,status:'accepted',kind:'selfdraw',groupId,acceptedAt:Date.now()};});return {...v,payments:next};},{applyLocally:false});say(result.committed?'三筆自摸付款已一起接收':'目前不符合三家自摸接收條件');}catch(e){say('全部接收失敗：'+e.message);}};
$('endGame').onclick=()=>modal('第一次確認','<p>確定要結束今日牌局嗎？</p><p class="muted">所有玩家將同步進入結算畫面，並永久停止新增付款。</p>',[{label:'取消',action:closeModal},{label:'下一步',className:'danger',action:()=>modal('第二次確認','<p><b>最後確認：永久結束本房間記帳。</b></p><p class="muted">此操作無法復原；若仍有待接收款項，系統會阻止結算。</p>',[{label:'返回',action:closeModal},{label:'確認今日結算',className:'danger',action:finishGame}])}]);
async function finishGame(){try{const result=await runTransaction(ref(db,'rooms/'+roomId),v=>{if(!v||v.status==='closed'||v.ownerPlayer!==playerId)return;if(Object.values(v.payments||{}).some(p=>p.status==='pending'))return;const sums=Object.fromEntries(Object.keys(v.players||{}).map(id=>[id,0]));Object.values(v.payments||{}).filter(p=>p.status==='accepted').forEach(p=>{sums[p.from]-=Number(p.amount);sums[p.to]+=Number(p.amount);});return {...v,status:'closed',closedAt:Date.now(),settlement:{sums,transfers:transferPlan(sums)}};},{applyLocally:false});closeModal();say(result.committed?'今日結算完成，已同步通知所有玩家。':'無法結算：請確認沒有待接收款項，且你是房主。');}catch(e){closeModal();say('結算失敗：'+e.message);}}
</script></body></html>
